name: Fase 1 - Seleccion

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'  # 09:00 UTC = 04:00 Ecuador

jobs:
  seleccion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - run: python seleccionar_partidos.py --forzar

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "seleccion: partidos del dia"
          file_pattern: "data/"
