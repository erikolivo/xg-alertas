name: Fase 1 - Seleccion + Complementar

on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'  # 22:00 UTC = 17:00 Ecuador
    - cron: '0 1 * * *'   # 01:00 UTC = 20:00 Ecuador
    - cron: '0 3 * * *'   # 03:00 UTC = 22:00 Ecuador

jobs:
  seleccion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Seleccionar y complementar partidos
        run: python seleccionar_partidos.py --forzar

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "seleccion: complemento del dia"
          file_pattern: "data/"

  # Despues de seleccionar, lanzar fase 3 automaticamente
  vigilancia:
    needs: seleccion
    uses: ./.github/workflows/fase3_vigilancia.yml
    secrets: inherit
